[package]
name = "khalil/portfolio-api"
version = "0.1.0"
description = "Khalil Samour portfolio: static site + save API, served by one Python script."

[dependencies]
"wasmer/python" = "^3.12"

[fs]
"/src" = "src"
"/public" = "public"

[[command]]
name = "main"
module = "wasmer/python:python"
runner = "wasi"

  [command.annotations.wasi]
  main-args = ["/src/main.py"]
